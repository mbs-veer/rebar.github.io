<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pass / Guide Change Log</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Custom configuration and colors */
      :root {
        --main-blue: #07384a;
        --teal-accent: #00a699;
        --coral-accent: #ff5a5f;
      }

      /* Apply Inter font globally */
      body {
        font-family: "Inter", sans-serif;
      }

      .bg-main-blue {
        background-color: var(--main-blue);
      }
      .text-main-blue {
        color: var(--main-blue);
      }
      .text-teal {
        color: var(--teal-accent);
      }
      .bg-teal-btn {
        background-color: var(--teal-accent);
      }
      .text-coral {
        color: var(--coral-accent);
      }
      .bg-coral-btn {
        background-color: var(--coral-accent);
      }

      /* Pass/Guide Log form adjustments */
      .card {
        max-width: 100%;
        box-shadow: none;
        padding: 0;
        background: transparent;
      }
      input, select {
        border-radius: 0.5rem;
        padding: 0.6rem;
      }

      /* Scrollbar cleanup */
      pre#preview {
        max-height: 240px;
      }
    </style>
  </head>

  <body class="bg-gray-50 text-gray-800">
    <div id="app" class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
      
      <div id="guide-log-container" class="flex justify-center">
        <div class="w-full bg-white p-6 rounded-xl shadow-lg border border-gray-100">
          
          <div class="relative flex items-center justify-center mb-6 pb-4 border-b border-gray-100 w-full">
            
            <a href="index.html" class="absolute left-0 p-2 text-blue-900 bg-gray-100 hover:bg-gray-200 rounded-lg transition duration-150 flex items-center justify-center shadow-sm z-10" title="Home">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
              </svg>
            </a>

            <h2 class="text-2xl font-bold text-coral text-center px-12">
              Pass / Guide Change Log
            </h2>
          </div>

          <div class="bg-gray-50 p-4 rounded-xl border mb-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="flex flex-col">
                <label class="text-sm font-medium mb-1 text-gray-700">Size</label>
                <select id="dia" class="border border-gray-300 rounded-lg p-2">
                  <option value="">Select</option>
                  <option value="10">10MM</option>
                  <option value="12">12MM</option>
                  <option value="16">16MM</option>
                  <option value="20">20MM</option>
                  <option value="25">25MM</option>
                  <option value="32">32MM</option>
                </select>
              </div>

              <div class="flex flex-col">
                <label class="text-sm font-medium mb-1 text-gray-700">Date</label>
                <input id="date_guide" type="date" class="border border-gray-300 rounded-lg p-2" />
              </div>

              <div class="flex flex-col">
                <label class="text-sm font-medium mb-1 text-gray-700">Shift</label>
                <select id="shift_guide" class="border border-gray-300 rounded-lg p-2">
                  <option value="">-- select shift --</option>
                  <option>DAY</option>
                  <option>NIGHT</option>
                </select>
              </div>

              <div class="flex flex-col">
                <label class="text-sm font-medium mb-1 text-gray-700">Billet No.</label>
                <input
                  id="billet"
                  type="text"
                  maxlength="3"
                  class="border border-gray-300 rounded-lg p-2"
                  oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,3);"
                />
              </div>
            </div>
          </div>

          <div id="jobCardsContainer" class="flex flex-col gap-4"></div>

          <div class="mt-4 flex justify-center">
            <button
              id="addJobBtn"
              class="px-4 py-2 bg-teal-600 text-white font-semibold rounded-lg shadow hover:bg-teal-700"
            >
              + Add Job
            </button>
          </div>
          
          <div class="flex flex-col gap-3 mt-6">
            <button
              id="generateBtn"
              class="bg-coral-btn text-white px-4 py-3 font-semibold rounded-lg hover:bg-red-600 transition duration-150 shadow-md"
            >
              Generate
            </button>
            <button
              id="copyBtn"
              class="bg-white text-coral border border-gray-300 px-4 py-3 font-semibold rounded-lg hover:bg-gray-50 transition duration-150 shadow-sm"
            >
              Copy text
            </button>
            <button
              id="waBtn"
              class="bg-white text-teal border border-gray-300 px-4 py-3 font-semibold rounded-lg hover:bg-gray-50 transition duration-150 shadow-sm"
            >
              Share to WhatsApp
            </button>
            <button
              id="clearBtn"
              class="bg-white text-gray-500 border border-gray-300 px-4 py-3 font-semibold rounded-lg hover:bg-gray-50 transition duration-150 shadow-sm"
            >
              Clear Form
            </button>
          </div>
          
          <div class="mt-4">
            <label class="block text-sm font-medium mb-2 text-gray-700">Preview:</label>
            <pre
              id="preview"
              class="w-full p-4 bg-gray-100 border border-gray-300 rounded-lg h-48 overflow-y-auto text-sm whitespace-pre-wrap"
            ></pre>
          </div>

          <div class="mt-4 text-xs text-gray-500 text-center">
            This WEBAPP is a controlled application.
          </div>
        </div>
      </div>

    </div>

    <script>
      // ======= DOM ELEMENTS =======
      const size = document.getElementById("dia");
      const dateIn = document.getElementById("date_guide");
      const shift = document.getElementById("shift_guide");
      const billet = document.getElementById("billet");
      const jobCardsContainer = document.getElementById("jobCardsContainer");
      const addJobBtn = document.getElementById("addJobBtn");

      const preview = document.getElementById("preview");
      const generateBtn = document.getElementById("generateBtn");
      const copyBtn = document.getElementById("copyBtn");
      const waBtn = document.getElementById("waBtn");
      const clearBtn = document.getElementById("clearBtn");

      // ======= INITIAL FORM SETUP =======
      if (dateIn) dateIn.value = new Date().toISOString().split("T")[0];
      if (shift) {
        const hour = new Date().getHours();
        shift.value = hour >= 8 && hour < 20 ? "DAY" : "NIGHT";
      }

      // ======= DYNAMIC JOB CARD CREATION =======
      function createJobCard() {
        const card = document.createElement("div");
        card.className = "bg-white p-4 rounded-xl border shadow job-card";

        // Helper to generate options 1-20 for Pass Changes
        const passOptions = Array.from({length: 20}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('');
        
        // Helper to generate options 1-15 for Active Pass
        const activePassOptions = Array.from({length: 15}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('');

        card.innerHTML = `
            <div class="flex justify-between mb-2">
                <h3 class="font-semibold text-main-blue">Job Entry</h3>
                <button class="removeJob bg-red-500 text-white px-2 py-1 rounded-lg text-sm">×</button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="flex flex-col">
                    <label class="text-sm font-medium mb-1 text-gray-700">Stand No.</label>
                    <select class="standSel border border-gray-300 rounded-lg p-2">
                        <option value="">-- select --</option>
                        <option>A</option><option>B</option>
                        ${Array.from({length: 18}, (_, i) => `<option>${i+1}</option>`).join('')}
                    </select>
                </div>

                <div class="flex flex-col">
                    <label class="text-sm mb-1 font-medium text-gray-700">Changes</label>
                    <div class="flex flex-col gap-1 text-sm">
                        <label><input type="checkbox" class="pc mr-2"> Pass Change</label>
                        <label><input type="checkbox" class="gc mr-2"> Guide Change</label>
                        <label><input type="checkbox" class="sc mr-2"> Stand Change</label>
                    </div>
                </div>

                <div class="passNumberBlock col-span-1 sm:col-span-2 hidden bg-blue-50 p-3 rounded-lg border border-blue-100">
                    <p class="text-xs font-bold text-blue-700 mb-2 uppercase">Pass Details</p>
                    <div class="flex items-center gap-4">
                        <div class="flex-1">
                            <label class="text-xs text-gray-600">From Pass</label>
                            <select class="fromPass border border-gray-300 rounded p-1 w-full">${passOptions}</select>
                        </div>
                        <div class="text-gray-400 mt-4">→</div>
                        <div class="flex-1">
                            <label class="text-xs text-gray-600">To Pass</label>
                            <select class="toPass border border-gray-300 rounded p-1 w-full">${passOptions}</select>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col guideTypeBlock col-span-1 sm:col-span-2 hidden">
                    <label class="text-sm font-medium mb-1 text-gray-700">Guide Types</label>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <label><input class="gt" data-type="Entry" type="checkbox"> Entry</label>
                        <label><input class="gt" data-type="Delivery" type="checkbox"> Delivery</label>
                    </div>
                </div>

                <div class="activePassBlock col-span-1 sm:col-span-2 hidden bg-purple-50 p-3 rounded-lg border border-purple-100">
                    <div class="flex flex-col">
                        <label class="text-xs font-bold text-purple-700 mb-1 uppercase">Active Pass</label>
                        <select class="activePassSel border border-gray-300 rounded p-1 w-full">
                            <option value="">-- select active pass --</option>
                            ${activePassOptions}
                        </select>
                    </div>
                </div>

                <div class="flex flex-col sm:col-span-2">
                    <label class="text-sm font-medium mb-1 text-gray-700">Remarks</label>
                    <input type="text" class="remarks border border-gray-300 rounded-lg p-2">
                </div>
            </div>
        `;

        // Toggle Pass Number Block
        card.querySelector(".pc").addEventListener("change", (e) => {
            card.querySelector(".passNumberBlock").classList.toggle("hidden", !e.target.checked);
            updatePreviewGuide();
        });

        // Toggle Guide Type Block
        card.querySelector(".gc").addEventListener("change", (e) => {
            card.querySelector(".guideTypeBlock").classList.toggle("hidden", !e.target.checked);
            updatePreviewGuide();
        });

        // Toggle Stand Change (Active Pass) Block
        card.querySelector(".sc").addEventListener("change", (e) => {
            card.querySelector(".activePassBlock").classList.toggle("hidden", !e.target.checked);
            updatePreviewGuide();
        });

        // Update preview on any change inside the card
        card.querySelectorAll("select, input").forEach(el => {
            el.addEventListener("change", updatePreviewGuide);
        });

        card.querySelector(".removeJob").addEventListener("click", () => {
            card.remove();
            updatePreviewGuide();
        });

        return card;
      }

      addJobBtn.addEventListener("click", () => {
        const card = createJobCard();
        jobCardsContainer.appendChild(card);
        updatePreviewGuide();
      });

      // ======= ENGINE TEXT GENERATION =======
      function buildText() {
        let lines = [];
        lines.push("*PASS / GUIDE CHANGE REPORT*");
        lines.push(`Size: ${size?.value || "-"}MM`);
        lines.push(`Date: ${dateIn?.value || "-"}`);
        lines.push(`Shift: ${shift?.value || "-"}`);
        lines.push(`Billet No: ${billet?.value || "-"}`);
        lines.push("");

        const jobs = document.querySelectorAll(".job-card");
        jobs.forEach((job) => {
            const standVal = job.querySelector(".standSel")?.value || "-";
            lines.push(`Stand No: ${standVal}`);

            const pcChecked = job.querySelector(".pc")?.checked;
            const gcChecked = job.querySelector(".gc")?.checked;
            const scChecked = job.querySelector(".sc")?.checked;

            if (pcChecked) {
                const fromP = job.querySelector(".fromPass").value;
                const toP = job.querySelector(".toPass").value;
                lines.push(`*Pass Changed: Pass ${fromP} → Pass ${toP}*`);
            }

            if (gcChecked) {
                const gts = [...job.querySelectorAll(".gt:checked")].map(cb => cb.dataset.type);
                if (gts.length) lines.push(`*${gts.join(", ")} Guide Changed*`);
            }

            if (scChecked) {
                const activePassVal = job.querySelector(".activePassSel").value;
                let standText = "*Stand Changed*";
                if (activePassVal) {
                    standText += ` (Active Pass: ${activePassVal})`;
                }
                lines.push(standText);
            }

            const rem = job.querySelector(".remarks")?.value;
            if (rem?.trim()) lines.push(`Remarks: ${rem}`);

            lines.push(""); 
        });

        return lines.join("\n");
      }

      function updatePreviewGuide() {
        if (preview) preview.textContent = buildText();
      }

      // ======= BUTTON LISTENERS =======
      generateBtn?.addEventListener("click", updatePreviewGuide);

      copyBtn?.addEventListener("click", async () => {
        const text = buildText();
        try {
          await navigator.clipboard.writeText(text);
          document.body.insertAdjacentHTML(
            "afterbegin",
            '<div id="copy-msg-guide" class="fixed top-4 right-4 bg-coral-btn text-white p-3 rounded-lg shadow-xl z-50">Copied to clipboard.</div>'
          );
          setTimeout(() => document.getElementById("copy-msg-guide")?.remove(), 2000);
        } catch (e) {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          document.body.insertAdjacentHTML(
            "afterbegin",
            '<div id="copy-msg-guide-fail" class="fixed top-4 right-4 bg-coral-btn text-white p-3 rounded-lg shadow-xl z-50">Copied to clipboard (fallback).</div>'
          );
          setTimeout(() => document.getElementById("copy-msg-guide-fail")?.remove(), 2000);
        }
      });

      waBtn?.addEventListener("click", async () => {
        const text = buildText();

        if (navigator.share) {
          try {
            await navigator.share({
              title: "Pass / Guide Change Report",
              text: text,
            });
            return;
          } catch (err) {}
        }

        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            document.body.insertAdjacentHTML(
              "afterbegin",
              '<div id="copy-msg" class="fixed top-4 right-4 bg-teal-600 text-white p-3 rounded-lg shadow-xl z-50">Copied to clipboard.</div>'
            );
            setTimeout(() => document.getElementById("copy-msg")?.remove(), 2000);
          }
        } catch (err) {}

        const encoded = encodeURIComponent(text);
        window.open("https://api.whatsapp.com/send?text=" + encoded, "_blank");
      });

      clearBtn?.addEventListener("click", () => {
        if (dateIn) dateIn.value = new Date().toISOString().split("T")[0];
        if (shift) {
          const hour = new Date().getHours();
          shift.value = hour >= 8 && hour < 20 ? "DAY" : "NIGHT";
        }
        if (billet) billet.value = "";
        if (size) size.value = "";
        jobCardsContainer.innerHTML = "";
        
        if (preview) preview.textContent = 'Fill the form and click "Generate"';
        updatePreviewGuide();
      });

      // ======= LIVE PREVIEW WATCHERS =======
      [size, dateIn, shift, billet].forEach((el) => {
        el?.addEventListener("input", updatePreviewGuide);
      });

      // Initialize preview on load
      updatePreviewGuide();
    </script>
  </body>
</html>
