<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WhatsApp Zip → Excel Converter</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght=400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --muted: #6b7280;
      --accent: #25D366;
      --accent-gradient: linear-gradient(90deg, #25D366 0%, #1E88E5 100%);
      --radius: 16px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      background-color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shell {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      text-decoration: none;
      color: #1E88E5;
      font-weight: 600;
      font-size: 14px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 8px 0;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.lead {
      margin: 0 0 24px 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .file-area {
      border: 2px dashed #e5e7eb;
      background: #fafafa;
      padding: 32px 16px;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      transition: background 0.2s ease;
    }

    .file-area input[type=file] {
      display: none;
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      color: var(--muted);
    }

    .hint {
      font-size: 14px;
      color: var(--muted);
      word-break: break-all;
      max-width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      width: 100%;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
      background: var(--accent);
      color: white;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    .btn.secondary {
      background: transparent;
      color: #111827;
      border: 2px solid #e5e7eb;
    }

    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    #statusPreview {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
      text-align: center;
    }

    .actions-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="shell" role="main">
    <a href="#" class="back-link">← Home</a>
    
    <h1>WhatsApp Zip → Excel</h1>
    <p class="lead">Upload your WhatsApp exported ZIP file and get clean, parsed mill shift logs downloaded instantly.</p>

    <div class="file-area">
      <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
      </svg>
      
      <div class="hint" id="fileName">No file chosen</div>

      <div class="actions-wrapper">
        <label for="zipFile" class="btn secondary">Browse File</label>
        <input type="file" id="zipFile" accept=".zip" onchange="showFile(event)">
        
        <button class="btn" onclick="processZip()">Download Excel</button>
      </div>
    </div>

    <div id="statusPreview">Waiting for file</div>
  </div>

<script>
function showFile(e){
  const file = e.target.files[0];
  document.getElementById('fileName').textContent = file ? file.name : 'No file chosen';
  document.getElementById('statusPreview').textContent = file ? 'Ready to parse' : 'Waiting for file';
}

function toProperTitleCase(str) {
  const smallWords = new Set([
    'and','or','but','for','nor','a','an','the','as','at','by','from','in','of','on','to','with','due','so',
    'hit','change','made','bolt','bend','nose','broken','both','came','tripped','accumulated','modification','check',
    'enter','exit','close','leave','left','open','crossed','cross','crosses','checking','checked','checks',
    'missed','miss','misses','rolled','rolledout','rolledin','same','time','adjustment','adjusted','delay','delayed',
    'removed','remove','added','add','did','not','repeated','repeat','progress','material','done','out','formed',
    'between','knocked','down','side'
  ]);

  return str
    .toLowerCase()
    .split(' ')
    .map((word, index) => {
      if (index !== 0 && smallWords.has(word)) {
        return word;
      }
      return word.charAt(0).toUpperCase() + word.slice(1);
    })
    .join(' ');
}

async function processZip(){
  const fileInput = document.getElementById('zipFile');
  if(!fileInput.files[0]){
    alert('Please upload a zip file.');
    return;
  }
  const file = fileInput.files[0];
  const status = document.getElementById('statusPreview');
  status.textContent = 'Parsing...';

  try {
    const jszip = new JSZip();
    const zip = await jszip.loadAsync(file);
    const textPromises = Object.keys(zip.files)
      .filter(filename => filename.toLowerCase().endsWith('.txt'))
      .map(filename => zip.files[filename].async('string'));

    const texts = await Promise.all(textPromises);
    const allText = texts.join('\n');

    if(!allText.trim()){
      alert('No text files found or the files are empty.');
      status.textContent = 'No text files found';
      return;
    }

    // Adaptable regex to catch: "dd/mm/yy, hh:mm - Sender:" OR "dd/mm/yy, hh:mm AM/PM - Sender:"
    const messageRegex = /\d{2}\/\d{2}\/\d{2,4},\s*\d{1,2}:\d{2}(?:\s*[aApP][mM])?\s*-\s*[^:]+:/g;
    
    // Split text into individual messages
    const messages = allText.split(messageRegex).map(m => m.trim()).filter(m => m.length > 10);

    if(messages.length === 0){
      alert('Could not isolate message blocks. Please check the text file format.');
      status.textContent = 'Parsing failed';
      return;
    }

    let targetedDate = '';
    let targetedSize = '';
    const records = [];

    for (const msg of messages) {
      // Extract targeted shift date
      const dateMatch = msg.match(/(\d{2}-(?:[a-zA-Z]{3}|\d{2})-\d{4})/);
      if (dateMatch && !targetedDate) targetedDate = dateMatch[1];

      // Extract raw target log size (e.g., *12MM* or *16mm*)
      const sizeMatch = msg.match(/\*(\d+MM)\*/i);
      if (sizeMatch && !targetedSize) targetedSize = sizeMatch[1].toUpperCase();

      // Extract shift block time window
      const timeMatch = msg.match(/\*?(\d{2}:\d{2}\s*-\s*\d{2}:\d{2})\*?/);
      const logTime = timeMatch ? timeMatch[1] : '';

      // Helper to fetch structured fields safely
      const getField = key => {
        const regex = new RegExp(key + '\\s*:\\s*(.*)', 'i');
        const match = msg.match(regex);
        return match ? match[1].split('\n')[0].trim() : '';
      };

      let rolled = parseFloat(getField('Rolled')) || 0;
      let cobble = parseFloat(getField('Cobble')) || 0;
      let chop = parseFloat(getField('Chop')) || 0;

      // Extract and format delays list dynamically
      let delay = '';
      const delayStart = msg.search(/Delays\s*:/i);
      if(delayStart !== -1){
        let afterDelay = msg.substring(delayStart + 7).trim();
        afterDelay = afterDelay.split(/\*?Total\s*:/i)[0].trim();
        
        const delayLines = afterDelay.split('\n')
          .map(l => l.trim())
          .filter(l => l.startsWith('•') || l.startsWith('-') || l.startsWith('>'))
          .map(l => l.replace(/^[•->]\s*/, '> '));
          
        delay = delayLines
          .map(line => {
            if (line.startsWith('>')) {
              return '> ' + toProperTitleCase(line.substring(2));
            }
            return toProperTitleCase(line);
          })
          .join('\n');
      }

      // If we found at least a valid timeline context or structural data, register it
      if (logTime || rolled || cobble || chop || delay) {
        records.push({
          Time: logTime,
          "Rolled": rolled === 0 ? '' : rolled,
          Cobble: cobble === 0 ? '' : cobble,
          Chop: chop === 0 ? '' : chop,
          Delay: delay
        });
      }
    }

    if(records.length === 0){
      alert('No structured records could be extracted from your logs.');
      status.textContent = 'No records found';
      return;
    }

    // Build modern SheetJS Object Array layout
    const worksheetData = [
      ['Date', targetedDate],
      ['Size', targetedSize],
      ['Mill Speed', ''],
      [],
      Object.keys(records[0]),
      ...records.map(r => Object.values(r)),
      [],
      ['Day Tonnage', '', 'MT'],
      ['Night Tonnage', '', 'MT'],
      ['Billet Rolled', '', 'MT']
    ];

    const ws = XLSX.utils.aoa_to_sheet(worksheetData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'ShiftLogs');

    XLSX.writeFile(wb, 'WhatsApp_ShiftLogs.xlsx');
    status.textContent = 'Done — file downloaded';
    
  } catch (error) {
    console.error(error);
    alert('An unexpected error occurred while parsing the ZIP package.');
    status.textContent = 'Error processing file';
  }
}
</script>
</body>
</html>
