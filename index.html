<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rebar Mill Application Hub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Custom configuration and colors matching your design system */
      :root {
        --main-blue: #07384a;
        --teal-accent: #00a699;
        --coral-accent: #ff5a5f;
      }

      body {
        font-family: "Inter", sans-serif;
      }

      .text-main-blue {
        color: var(--main-blue);
      }
      .bg-main-blue {
        background-color: var(--main-blue);
      }
      .border-teal {
        border-color: var(--teal-accent);
      }
      .border-coral {
        border-color: var(--coral-accent);
      }
      .text-teal {
        color: var(--teal-accent);
      }
      .text-coral {
        color: var(--coral-accent);
      }
    </style>
  </head>

  <body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">
    
    <div class="h-2 w-full bg-gradient-to-r from-[#00a699] via-[#07384a] to-[#ff5a5f]"></div>

    <div class="max-w-6xl mx-auto px-4 py-8 sm:px-6 lg:px-8 flex-grow w-full">
      
      <header class="mb-10 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-gray-100 gap-4">
        <div>
          <h1 class="text-3xl font-black tracking-tight text-main-blue flex items-center gap-2">
            <span>Rebar Mill Hub</span>
          </h1>
           </div>
        <div class="flex items-center gap-2 bg-gray-50 px-4 py-2 rounded-full border border-gray-200">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="liveClock" class="text-xs font-mono font-bold text-gray-600">Loading Session...</span>
        </div>
      </header>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <a href="hourly.html" class="group relative bg-white p-6 rounded-2xl border-l-4 border-teal shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between">
         
            <h3 class="text-lg font-bold text-main-blue group-hover:text-teal transition-colors">Hourly Production Log</h3>
          
          
        </a>

        <a href="passChange.html" class="group relative bg-white p-6 rounded-2xl border-l-4 border-coral shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between">
          
            <h3 class="text-lg font-bold text-main-blue group-hover:text-coral transition-colors">Pass & Guide Changes</h3>
           
        </a>

        <a href="attendanceFinishing.html" class="group relative bg-white p-6 rounded-2xl border-l-4 border-cyan-600 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between">
          
            <h3 class="text-lg font-bold text-main-blue group-hover:text-cyan-600 transition-colors">Finishing Attendance</h3>
           
        </a>
        


        
        <a href="Stand_Checklist.html" class="group relative bg-white p-6 rounded-2xl border-l-4 border-cyan-600 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between">
          
            <h3 class="text-lg font-bold text-main-blue group-hover:text-cyan-600 transition-colors">Stand Checklist</h3>
           
        </a>
        
       

        <a href="Stand_Status_Report.html" class="group relative bg-white p-6 rounded-2xl border-l-4 border-indigo-600 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between">
         
            <h3 class="text-lg font-bold text-main-blue group-hover:text-indigo-600 transition-colors">Stand Status Report</h3>
            
        </a>

       
 <a href="report_generator_v_1.html" class="group relative bg-white p-6 rounded-2xl border-l-4 border-emerald-500 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between">
          
            <h3 class="text-lg font-bold text-main-blue group-hover:text-emerald-600 transition-colors">WhatsApp Report</h3>
          
        </a>
      </div>
    </div>

    <footer class="w-full bg-white border-t border-gray-200 py-4 mt-12">
      <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500 font-medium">
        HRM1 Production Department
      </div>
    </footer>

    <script>
      function updateClock() {
        const clockEl = document.getElementById('liveClock');
        if (clockEl) {
          const now = new Date();
          const options = { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
          clockEl.textContent = now.toLocaleString('en-US', options).toUpperCase();
        }
      }
      setInterval(updateClock, 1000);
      updateClock();
    </script>
  </body>
</html>
